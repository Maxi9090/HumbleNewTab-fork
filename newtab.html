<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>
	<title>New Tab</title>
	<meta name='color-scheme' content='dark light'>
	<link rel='stylesheet' href='newtab.css'>
	<link rel='modulepreload' href='js-src/bookmark-cache.mjs'>
	<link rel='modulepreload' href='js-src/themes.mjs'>
	<link rel='modulepreload' href='js-src/favicons-ui.mjs'>
	<link rel='modulepreload' href='js-src/config-engine.mjs'>
	<script type='module' src='js-src/newtab.mjs'></script>
	<link rel='icon' href='icons/newtab.svg'>
</head>
<body>
<div id='main'></div>
<div id='toast' role='status'></div>
<a id='options_button' title='Options' tabindex='0'></a>
<template id='options-template'>
	<div id='options'>
		<a id='options_close_button' title='Close' tabindex='0'>&times;</a>
		<ul id='options_nav'>
			<li><a class='current' tabindex='0'>Settings</a></li>
			<li><a tabindex='0'>Content</a></li>
			<li><a tabindex='0'>Text</a></li>
			<li><a tabindex='0'>Background</a></li>
			<li><a tabindex='0'>Layout</a></li>
			<li><a tabindex='0'>Details</a></li>
			<li><a tabindex='0'>Import/Export</a></li>
			<li><a tabindex='0'>CSS</a></li>
		</ul>
		<div class="section current">
			<fieldset>
				<label><span>Theme</span><select id='options_theme'></select></label>
			</fieldset>
			<fieldset>
				<label><span>Open links in</span><select id='options_newtab'>
					<option value='0'>Current tab</option>
					<option value='1'>New tab</option>
					<option value='2'>New tab (background)</option>
				</select></label>
				<label><span>Lock columns</span><input id='options_lock' type='checkbox'></label>
				<label><span>Remember open folders</span><input id='options_remember_open' type='checkbox'></label>
				<label><span>Auto-close folders</span><input id='options_auto_close' type='checkbox'></label>
				<label><span>Show top-level folders</span><input id='options_show_root' type='checkbox'></label>
				<label><span>Hide options button</span><input id='options_hide_options' type='checkbox'></label>
				<label><span>Hide scrollbar</span><input id='options_hide_scrollbar' type='checkbox'></label>
				<label><span>Remember scroll position</span><input id='options_remember_scroll' type='checkbox'></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<div id='options_show_bookmarks'></div>
			</fieldset>
			<fieldset>
				<label><span>Most visited</span><input id='options_show_top' type='checkbox'></label>
				<label class='subopt'><span>Number of items</span><input id='options_number_top' type='number' inputmode='numeric' min='1' max='50'></label>
				<label><span>Recent bookmarks</span><input id='options_show_recent' type='checkbox'></label>
				<label class='subopt'><span>Number of items</span><input id='options_number_recent' type='number' inputmode='numeric' min='1' max='50'></label>
				<label><span>Recently closed tabs</span><input id='options_show_closed' type='checkbox'></label>
				<label class='subopt'><span>Number of items</span><input id='options_number_closed' type='number' inputmode='numeric' min='1' max='25'></label>
				<label><span>Recently closed windows</span><input id='options_show_windows' type='checkbox'></label>
				<label class='subopt'><span>Number of items</span><input id='options_number_windows' type='number' inputmode='numeric' min='1' max='25'></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<label><span>Text color</span><input id='options_font_color' type='color'></label>
				<label><span>Font</span><input id='options_font' type='text'></label>
				<label><span>Size</span><input id='options_font_size' type='range' min='0.3' max='6' step='0.01'><span class='unit'>em</span></label>
				<label><span>Weight</span><input id='options_font_weight' type='range' min='100' max='900' step='1' list='font_weight_names'>
					<datalist id='font_weight_names'>
						<option value='100'>Thin</option>
						<option value='200'>Extra Light</option>
						<option value='300'>Light</option>
						<option value='400'>Regular</option>
						<option value='500'>Medium</option>
						<option value='600'>Semi Bold</option>
						<option value='700'>Bold</option>
						<option value='800'>Extra Bold</option>
						<option value='900'>Heavy</option>
					</datalist></label>
				<label><span>Outline</span><input id='options_font_outline' type='checkbox'></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<label><span>Background color</span><input id='options_background_color' type='color'></label>
			</fieldset>
			<fieldset>
				<legend>Image</legend>
				<label><input id='options_background_image_file' type='file' accept='image/*'><span class='file-status'></span></label>
				<label><span>Size</span><select id='options_background_size'>
					<option value='auto'>Original</option>
					<option value='cover'>Full</option>
					<option value='contain'>Best fit</option>
				</select></label>
				<label><span>Align</span><select id='options_background_align'>
					<option value='left top'>Top left</option>
					<option value='top'>Top</option>
					<option value='right top'>Top right</option>
					<option value='left'>Left</option>
					<option value='center'>Center</option>
					<option value='right'>Right</option>
					<option value='left bottom'>Bottom left</option>
					<option value='bottom'>Bottom</option>
					<option value='right bottom'>Bottom right</option>
				</select></label>
				<label><span>Tiling</span><select id='options_background_repeat'>
					<option value='repeat'>Tile</option>
					<option value='repeat-x'>Horizontal</option>
					<option value='repeat-y'>Vertical</option>
					<option value='no-repeat'>None</option>
				</select></label>
				<label><span>Zoom</span><input id='options_background_zoom' type='range' min='10' max='400' step='0.1'><span class='unit'>%</span></label>
				<label><span>Image scrolling</span><input id='options_background_scroll' type='checkbox'></label>
				<label class='subopt'><span>Scroll speed</span><input id='options_background_scroll_speed' type='range' min='0.1' max='3' step='0.1'></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<label><span>Item spacing</span><input id='options_spacing' type='range' min='0.8' max='5.6' step='0.01'></label>
				<label><span>Top margin</span><input id='options_v_margin' type='range' min='0' max='20' step='0.1'><span class='unit'>%</span></label>
				<label><span>Column width</span><input id='options_width' type='range' min='20' max='100' step='0.1'><span class='unit'>%</span></label>
				<label><span>Align</span><input id='options_h_pos' type='range' min='0' max='100' step='0.1'><span class='unit'>%</span></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<label><span>Highlight</span><input id='options_highlight_color' type='color'></label>
				<label><span>Highlight text</span><input id='options_highlight_font_color' type='color'></label>
				<label><span>Shadow color</span><input id='options_shadow_color' type='color'></label>
				<label><span>Shadow size</span><input id='options_shadow_blur' type='range' min='0' max='100' step='0.1'><span class='unit'>px</span></label>
				<label><span>Corner roundness</span><input id='options_highlight_round' type='range' min='0' max='1' step='0.01'><span class='unit'>em</span></label>
				<label><span>Highlight fade time</span><input id='options_fade' type='range' min='0' max='1' step='0.01'><span class='unit'>s</span></label>
			</fieldset>
			<fieldset>
				<label><span>Folder open time</span><input id='options_slide' type='range' min='0' max='1' step='0.01'><span class='unit'>s</span></label>
				<label><span>Dynamic height animation</span><input id='options_dynamic_height_animation' type='checkbox'></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<legend>Export settings</legend>
				<label><textarea id='options_export' readonly></textarea></label>
			</fieldset>
			<fieldset>
				<legend>Import settings</legend>
				<label><textarea id='options_import'></textarea></label>
			</fieldset>
		</div>
		<div class='section'>
			<fieldset>
				<legend>Generated CSS</legend>
				<label><textarea id='all_css' readonly></textarea></label>
			</fieldset>
			<fieldset>
				<legend>Custom CSS</legend>
				<label><textarea id='options_css'></textarea></label>
			</fieldset>
		</div>
	</div>
</template>
</body>
</html>
